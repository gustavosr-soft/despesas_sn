{% extends "base.html" %}
{% block titulo %}Alterar senha · Despesas{% endblock %}
{% block conteudo %}
<section class="cartao estreito">
  <h1>Alterar senha</h1>
  {% if usuario['trocar_senha'] %}<p class="nota">Por segurança, defina uma nova senha antes de continuar.</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Senha atual <input name="atual" type="password" autocomplete="current-password" required></label>
    <label>Nova senha (mínimo 8 caracteres) <input name="nova" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>Repita a nova senha <input name="confirma" type="password" autocomplete="new-password" minlength="8" required></label>
    <button type="submit" class="primario">Salvar nova senha</button>
  </form>
</section>
{% endblock %}
