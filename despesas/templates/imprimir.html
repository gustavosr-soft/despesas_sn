<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='impressao.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body class="tela-pdf" data-auto-print-pdf="1">
<div class="barra">
  <button type="button" data-print-pdf>Imprimir</button>
  <a href="{{ pdf_url }}" target="_blank" rel="noopener">Abrir o PDF</a>
  <button type="button" data-fechar>Fechar</button>
  <span>Imprime o PDF do estilo escolhido. Se a janela de impressão não abrir sozinha, clique em Imprimir.</span>
</div>
<iframe id="pdf-frame" class="pdf-frame" src="{{ pdf_url }}" title="{{ titulo }}"></iframe>
</body>
</html>
