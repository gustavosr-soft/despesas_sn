# ============================================================
#  Sistema de Despesas - arquivo de configuração
#  Edite com o Bloco de Notas e reinicie o servidor (INICIAR.bat)
#  Linhas começando com # são comentários.
#  Caminhos relativos são contados a partir desta pasta.
#  Em caminhos do Windows pode usar \ ou /  (ex.: D:\Despesas\backups)
# ============================================================

[servidor]
# 0.0.0.0 = aceita conexões de outros computadores da rede (use este no servidor).
# 127.0.0.1 = só aceita acesso do próprio computador (para testes).
host = 0.0.0.0
# Porta de acesso: http://IP-DO-SERVIDOR:porta  (se mudar, ajuste também o firewall)
porta = 8080
# Quantas requisições simultâneas atender
threads = 8

[banco]
# Arquivo do banco de dados (fica SOMENTE no servidor; não compartilhe esta pasta na rede)
caminho = dados/despesas.db

[backup]
# sim/nao - backup automático diário
ativo = sim
# Pasta dos backups. Ideal: outro disco ou pasta de rede (ex.: E:\BackupDespesas)
pasta = backups
# Horário (HH:MM) a partir do qual o backup do dia é feito
hora = 22:00
# Quantidade de backups mantidos (os mais antigos são apagados)
manter = 30

[logs]
pasta = logs
# DEBUG, INFO, WARNING ou ERROR
nivel = INFO

[seguranca]
# Minutos sem uso até pedir login de novo
sessao_minutos = 60
# Tentativas de senha erradas antes de bloquear o usuário
tentativas_max = 5
# Minutos de bloqueio após exceder as tentativas
bloqueio_minutos = 5
# Deixe vazio: o sistema cria e guarda uma chave própria em dados\chave_secreta.txt
chave_secreta =
# Use 'sim' somente se configurar HTTPS (com HTTP simples deixe 'nao')
cookie_seguro = nao

[relatorios]
# Nome que aparece abaixo do título nos relatórios (opcional)
empresa =
